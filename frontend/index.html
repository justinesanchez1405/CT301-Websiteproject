<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Makes phones use their real width instead of zooming out to a fake desktop width. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A worship and music team website: meet the team, hear the songs, see upcoming events, and apply to join." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Brand fonts from Google Fonts. preconnect starts the connection early so text appears sooner. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@400;500;700&display=swap" rel="stylesheet" />

    <!-- Fallback title. Each page sets its own <title> from inside its component. -->
    <title>Tehillim</title>
  </head>
  <body>
    <!-- This is the ONLY HTML page in the app. React draws every page inside #root. -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
